<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOIDRUNNER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
  :root {
    --bg:#060810;--bg2:#0d1117;--panel:#0a0f18;
    --border:#1a2a3a;--border-bright:#2a4a6a;
    --text:#8fb3cc;--text-dim:#3a5a7a;--text-bright:#c8e8ff;
    --accent:#00c8ff;--accent-dim:#005a7a;
    --danger:#ff2840;--gold:#ffaa00;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;user-select:none;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:100;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);}

  #starfield{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .star{position:absolute;border-radius:50%;background:white;}

  /* Ambient glow behind title */
  #glow{position:fixed;top:20%;left:50%;transform:translate(-50%,-50%);width:600px;height:300px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,200,255,0.04) 0%,transparent 70%);pointer-events:none;z-index:0;}

  /* ── LAYOUT ── */
  #screen{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:0;width:100%;max-width:480px;padding:0 32px;}

  /* ── TITLE ── */
  #title-block{text-align:center;margin-bottom:56px;}
  #title-eyebrow{font-size:8px;letter-spacing:6px;color:var(--text-dim);margin-bottom:16px;animation:fadeUp 1s ease both;}
  #title-main{font-family:'Orbitron',monospace;font-size:clamp(36px,8vw,58px);font-weight:900;letter-spacing:8px;color:var(--text-bright);text-shadow:0 0 40px rgba(0,200,255,0.25),0 0 80px rgba(0,200,255,0.1);line-height:1;animation:fadeUp 1s 0.1s ease both;}
  #title-sub{margin-top:14px;font-size:9px;letter-spacing:4px;color:var(--text-dim);animation:fadeUp 1s 0.2s ease both;}

  /* ── MENU ── */
  #menu{display:flex;flex-direction:column;width:100%;gap:2px;animation:fadeUp 1s 0.35s ease both;}
  .menu-item{display:flex;align-items:center;gap:16px;padding:16px 20px;border:1px solid var(--border);background:transparent;cursor:pointer;transition:all 0.2s;text-decoration:none;color:inherit;font-family:'Share Tech Mono',monospace;}
  .menu-item:hover{background:rgba(0,200,255,0.04);border-color:var(--border-bright);}
  .menu-item:active{background:rgba(0,200,255,0.08);}
  .menu-item.disabled{opacity:0.3;cursor:default;pointer-events:none;}
  .menu-item + .menu-item{border-top:none;}
  .menu-arrow{font-size:10px;color:var(--accent-dim);transition:all 0.2s;flex-shrink:0;}
  .menu-item:hover .menu-arrow{color:var(--accent);transform:translateX(4px);}
  .menu-body{flex:1;}
  .menu-label{font-size:13px;letter-spacing:3px;color:var(--text-bright);text-transform:uppercase;}
  .menu-item:hover .menu-label{color:var(--accent);}
  .menu-item.disabled .menu-label{color:var(--text-dim);}
  .menu-desc{font-size:8px;letter-spacing:1px;color:var(--text-dim);margin-top:3px;}

  /* ── FOOTER ── */
  #footer{margin-top:48px;display:flex;align-items:center;gap:24px;font-size:8px;letter-spacing:2px;color:var(--text-dim);animation:fadeUp 1s 0.5s ease both;}
  #footer span{color:#2a4a3a;}

  /* ── PREVIOUS VERSIONS ── */
  #versions{margin-top:32px;width:100%;animation:fadeUp 1s 0.6s ease both;}
  #versions-label{font-size:7px;letter-spacing:4px;color:var(--text-dim);margin-bottom:8px;text-align:center;}
  #versions-list{display:flex;flex-direction:column;gap:2px;}
  .version-link{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border:1px solid var(--border);text-decoration:none;color:var(--text-dim);font-size:9px;letter-spacing:2px;transition:all 0.15s;}
  .version-link:hover{border-color:var(--border-bright);color:var(--text);}
  .version-link + .version-link{border-top:none;}
  #versions-empty{font-size:8px;letter-spacing:2px;color:var(--text-dim);opacity:0.4;text-align:center;padding:10px 0;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="starfield"></div>
<div id="glow"></div>

<div id="screen">

  <div id="title-block">
    <div id="title-eyebrow">// PROTOTYPE v0.2</div>
    <div id="title-main">VOIDRUNNER</div>
    <div id="title-sub">THE GALAXY IS SILENT. RUN.</div>
  </div>

  <nav id="menu">
    <a class="menu-item" href="voidrunner_1.html">
      <div class="menu-body">
        <div class="menu-label">PLAY GAME</div>
        <div class="menu-desc">Start a new run — 7 encounters</div>
      </div>
      <div class="menu-arrow">▶</div>
    </a>
    <a class="menu-item" href="cards.html">
      <div class="menu-body">
        <div class="menu-label">CARD LIBRARY</div>
        <div class="menu-desc">Browse all 21 cards</div>
      </div>
      <div class="menu-arrow">▶</div>
    </a>
    <div class="menu-item disabled">
      <div class="menu-body">
        <div class="menu-label">SETTINGS</div>
        <div class="menu-desc">Not yet implemented</div>
      </div>
      <div class="menu-arrow">▶</div>
    </div>
  </nav>

  <div id="footer">
    <span>MIHAI PETICA — 2026</span>
  </div>

  <div id="versions">
    <div id="versions-label">PREVIOUS VERSIONS</div>
    <div id="versions-list">
      <!-- Add entries here when a new version ships. Example:
      <a class="version-link" href="v0.2/">
        <span>v0.2 — 2026-04-13</span><span>▶</span>
      </a>
      -->
      <div id="versions-empty">— NONE YET —</div>
    </div>
  </div>

</div>

<script>
// Title music — starts on first interaction
let _titleStarted = false;
function _bootAudio() {
  if (_titleStarted) return;
  _titleStarted = true;
  try {
    const a = new Audio('sounds/title.mp3');
    a.loop = true; a.volume = 0;
    a.play().catch(() => {});
    let v = 0;
    const t = setInterval(() => { a.volume = Math.min(0.32, v += 0.016); if (v >= 0.32) clearInterval(t); }, 50);
  } catch(e) {}
}
document.addEventListener('pointerdown', _bootAudio, { once: true });

// Hover SFX on menu items
document.querySelectorAll('.menu-item:not(.disabled)').forEach(el => {
  el.addEventListener('mouseenter', () => {
    try { const a = new Audio('sounds/hover.mp3'); a.volume = 0.25; a.play().catch(() => {}); } catch(e) {}
  });
});

(function() {
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 200; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2.2 + 0.3;
    s.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;left:' + (Math.random()*100) + '%;top:' + (Math.random()*100) + '%;opacity:' + (Math.random()*0.6+0.05) + ';';
    if (Math.random() > 0.65) s.style.background = '#ffbbaa';
    sf.appendChild(s);
  }
})();
</script>
</body>
</html>

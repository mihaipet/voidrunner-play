<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voidrunner — Card Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  body {
    background: #0d0d0f;
    color: #c8c8d0;
    font-family: 'Courier New', monospace;
    font-size: 15px;
    padding: 32px 36px 36px 262px;
    transition: padding-left 0.15s;
  }
  body.nav-collapsed { padding-left: 76px; }

  /* ─── FILTER BAR ──────────────────────────────────────────────── */

  #sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 230px;
    z-index: 100;
    background: #090909;
    border-right: 1px solid #222230;
    padding: 14px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    transition: width 0.15s, padding 0.15s;
  }
  body.nav-collapsed #sidebar { width: 48px; padding: 14px 9px; overflow: hidden; }
  body.nav-collapsed #sidebar .nav-body,
  body.nav-collapsed #sidebar .nav-title { display: none; }

  #nav-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nav-title { font-size: 12px; letter-spacing: 0.18em; color: #fff; white-space: nowrap; }
  #nav-toggle {
    font-family: 'Courier New', monospace; font-size: 16px; line-height: 1;
    width: 28px; height: 28px; flex-shrink: 0;
    border: 1px solid #242432; background: none; color: #8888aa;
    cursor: pointer; border-radius: 3px;
  }
  #nav-toggle:hover { border-color: #404058; color: #b0b0e0; }

  .nav-body { display: flex; flex-direction: column; gap: 14px; }
  .nav-search { display: flex; flex-direction: column; gap: 8px; }

  .filter-sep {
    width: 100%; height: 1px;
    background: #222230;
    flex-shrink: 0;
  }

  .filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }

  .filter-label {
    width: 100%;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #3a3a50;
    margin: 0 0 2px;
    white-space: nowrap;
  }

  .filter-btn {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 3px 9px;
    border: 1px solid #242432;
    background: none;
    color: #555570;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    border-radius: 2px;
    white-space: nowrap;
    transition: border-color 0.1s, color 0.1s;
  }

  .filter-btn:hover { border-color: #404058; color: #8888aa; }

  .filter-btn.active          { background: #16162a; border-color: #4848a0; color: #b0b0e0; }
  .filter-btn[data-value="kinetic"].active { background: #160e04; border-color: #aa5522; color: #dd9955; }
  .filter-btn[data-value="arc"].active     { background: #040a18; border-color: #2255aa; color: #5599dd; }
  .filter-btn[data-value="plasma"].active  { background: #160404; border-color: #aa3333; color: #dd6666; }
  .filter-btn[data-value="gamma"].active   { background: #04120a; border-color: #229944; color: #55cc88; }
  .filter-btn[data-value="shield"].active  { background: #04101a; border-color: #226688; color: #55aacc; }
  .filter-btn[data-value="ST"].active      { background: #14141e; border-color: #5a5a6e; color: #aaaacc; }
  .filter-btn[data-value="C"].active       { background: #040a18; border-color: #3a6aaa; color: #6699dd; }
  .filter-btn[data-value="R"].active       { background: #04120a; border-color: #4a7c4a; color: #88cc88; }
  .filter-btn[data-value="E"].active       { background: #16041a; border-color: #8a3aaa; color: #bb77dd; }
  .filter-btn[data-value="U"].active       { background: #1a1000; border-color: #cc8800; color: #ddaa22; }

  /* ─── PAGE ───────────────────────────────────────────────────── */

  h1 { color: #fff; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .meta { color: #9090a0; font-size: 14px; margin-bottom: 40px; }

  .section-title {
    color: #a0a0b0; font-size: 14px; text-transform: uppercase;
    letter-spacing: 0.15em; margin: 40px 0 16px;
    border-bottom: 1px solid #2a2a34; padding-bottom: 8px;
  }

  .grid { display: flex; flex-wrap: wrap; gap: 18px; }

  /* ─── CARDS ──────────────────────────────────────────────────── */

  .card {
    width: 330px; background: #13131a; border: 1px solid #222;
    border-top: 4px solid #444; padding: 20px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .card.ST  { border-top-color: #5a5a6e; }
  .card.C   { border-top-color: #3a6aaa; }
  .card.R   { border-top-color: #4a7c4a; }
  .card.E   { border-top-color: #8a3aaa; }
  .card.U   { border-top-color: #cc8800; }
  .card.wip { border-style: dashed; border-top-style: dashed; opacity: 0.6; }

  .card-name { color: #fff; font-size: 19px; font-weight: bold; letter-spacing: 0.05em; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }

  .tag { font-size: 11px; padding: 3px 8px; border-radius: 2px; text-transform: uppercase; letter-spacing: 0.08em; }
  .tag-type    { background: #1e1e2e; color: #a0a0c0; }
  .tag-ST      { background: #2a2a3a; color: #aaaacc; }
  .tag-C       { background: #1a2040; color: #6699dd; }
  .tag-R       { background: #1a2e1a; color: #88cc88; }
  .tag-E       { background: #2a1a3a; color: #bb77dd; }
  .tag-U       { background: #2e2000; color: #ddaa22; }
  .tag-kinetic { background: #2e1e10; color: #dd9955; }
  .tag-arc     { background: #101e2e; color: #5599dd; }
  .tag-plasma  { background: #2e1010; color: #dd6666; }
  .tag-gamma   { background: #102e10; color: #55cc88; }
  .tag-shield  { background: #101e2e; color: #55aacc; }
  .tag-routine { background: #1e1e10; color: #cccc55; }

  hr.divider { border: none; border-top: 1px solid #1e1e22; }

  .card-row { display: flex; justify-content: space-between; color: #9090a0; font-size: 13px; }
  .card-row span:last-child { color: #d0d0d8; text-align: right; }
  .card-effect { color: #c0c0c8; font-size: 13px; line-height: 1.6; }
  .card-effect strong { color: #ffffff; }
  .card-upgrade { color: #9090a8; font-size: 12px; line-height: 1.5; border-left: 2px solid #2a2a3a; padding-left: 10px; }
  .card-upgrade span { color: #7070a0; }
  .card-conditions { color: #dd7777; font-size: 12px; font-style: italic; }
  .card-compat { color: #6a8fa8; font-size: 12px; }
  .card-na { color: #444455; font-style: italic; font-size: 12px; }

  /* ─── ENEMY CARDS ────────────────────────────────────────────────── */

  .ecard {
    width: 340px; background: #0d0e12; border: 1px solid #2a2d35;
    border-top: 4px solid #4a4d58; border-radius: 6px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .ecard.standard { border-top-color: #4a6a8a; }
  .ecard.boss     { border-top-color: #b0445a; }
  .ecard.rare     { border-top-color: #cc8800; }
  .ecard.wip      { border-style: dashed; opacity: 0.72; }

  .ecard-sec { padding: 11px 14px; border-bottom: 1px solid #1f2128; }
  .ecard-sec:last-child { border-bottom: none; }
  .ecard-head { display: flex; align-items: flex-start; gap: 12px; background: #101218; }
  .ecard-tag  { font-size: 11px; letter-spacing: 0.25em; color: #ff2840; }
  .ecard.boss .ecard-tag { color: #ff5b8a; }
  .ecard.rare .ecard-tag { color: #ddaa22; }
  .ecard-name { color: #fff; font-size: 17px; font-weight: bold; letter-spacing: 0.08em; margin-top: 2px; }
  .ecard-meta { font-size: 11px; letter-spacing: 0.05em; color: #6b6f78; margin-top: 3px; }

  .erow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .elbl { font-size: 11px; letter-spacing: 0.18em; color: #6b6f78; text-transform: uppercase; }
  .ebar { height: 9px; background: #1b1d24; border: 1px solid #2a2d35; border-radius: 2px; overflow: hidden; }
  .ebar > div { height: 100%; }
  .echip {
    font-size: 11px; letter-spacing: 0.06em; padding: 3px 7px;
    border: 1px solid #2a2d35; border-radius: 3px; color: #9aa0ab; white-space: nowrap;
  }
  .echip.atk { border-color: #5a0010; color: #ff5b6e; }
  .e-ok   { color: #3b6d11; }
  .e-warn { color: #ba7517; }
  .e-val  { font-size: 11px; color: #c8ccd4; }
  .e-arc    { color: #26c6da; }
  .e-plasma { color: #ff7a3c; }
  .e-gamma  { color: #a855f7; }
  .e-dim    { color: #6b6f78; }

  /* view + filter-group visibility */
  .fg-cards { display: contents; }
  .fg-enemies { display: none; }
  body.view-enemies .fg-cards { display: none; }
  body.view-enemies .fg-enemies { display: contents; }
  .filter-btn[data-filter="view"].active { background: #1a0a0e; border-color: #aa3050; color: #ff7a90; }
  .filter-btn[data-value="standard"].active { background: #0a1420; border-color: #4a6a8a; color: #7fa8d0; }
  .filter-btn[data-value="boss"].active     { background: #1a0a10; border-color: #b0445a; color: #ff7a90; }
  .filter-btn[data-value="rare"].active     { background: #1a1000; border-color: #cc8800; color: #ddaa22; }
  .card-5perk { border: 1px solid #252535; border-left: 3px solid #5555a0; padding: 8px 10px; background: #0e0e18; }
  .perk5-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #6060a0; margin-bottom: 4px; }

  #search-box {
    background: transparent;
    border: 1px solid #333344;
    color: #c8c8d0;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    padding: 5px 10px;
    outline: none;
    width: 100%;
  }
  #clear-filters { width: 100%; }
  #search-box:focus { border-color: #5555a0; }
  #search-box::placeholder { color: #444455; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="nav-header">
    <span class="nav-title">VOIDRUNNER</span>
    <button id="nav-toggle" aria-label="Collapse sidebar" title="Collapse / expand">‹</button>
  </div>

  <div class="nav-body">
  <div class="filter-group">
    <span class="filter-label">View</span>
    <button class="filter-btn active" data-filter="view" data-value="cards">Cards</button>
    <button class="filter-btn" data-filter="view" data-value="enemies">Enemies</button>
  </div>
  <div class="filter-sep"></div>

  <div class="nav-search">
    <input id="search-box" type="text" placeholder="Search…" autocomplete="off">
    <button id="clear-filters" class="filter-btn">Clear filters</button>
  </div>
  <div class="filter-sep"></div>

  <span class="fg-cards">
    <div class="filter-group">
      <span class="filter-label">Show</span>
      <button class="filter-btn active" data-filter="section" data-value="all">All</button>
      <button class="filter-btn" data-filter="section" data-value="protocol">Protocols</button>
      <button class="filter-btn" data-filter="section" data-value="routine">Routines</button>
      <button class="filter-btn" data-filter="section" data-value="wip">WIP</button>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <span class="filter-label">Type</span>
      <button class="filter-btn active" data-filter="type" data-value="all">All</button>
      <button class="filter-btn" data-filter="type" data-value="weapon">Weapon</button>
      <button class="filter-btn" data-filter="type" data-value="shield">Shield</button>
      <button class="filter-btn" data-filter="type" data-value="system">System</button>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <span class="filter-label">Element</span>
      <button class="filter-btn active" data-filter="element" data-value="all">All</button>
      <button class="filter-btn" data-filter="element" data-value="kinetic">Kinetic</button>
      <button class="filter-btn" data-filter="element" data-value="arc">Arc</button>
      <button class="filter-btn" data-filter="element" data-value="plasma">Plasma</button>
      <button class="filter-btn" data-filter="element" data-value="gamma">Gamma</button>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <span class="filter-label">Rarity</span>
      <button class="filter-btn active" data-filter="rarity" data-value="all">All</button>
      <button class="filter-btn" data-filter="rarity" data-value="ST">ST</button>
      <button class="filter-btn" data-filter="rarity" data-value="C">C</button>
      <button class="filter-btn" data-filter="rarity" data-value="R">R</button>
      <button class="filter-btn" data-filter="rarity" data-value="E">E</button>
      <button class="filter-btn" data-filter="rarity" data-value="U">U</button>
    </div>
  </span>

  <span class="fg-enemies">
    <div class="filter-group">
      <span class="filter-label">Class</span>
      <button class="filter-btn active" data-filter="eclass" data-value="all">All</button>
      <button class="filter-btn" data-filter="eclass" data-value="standard">Standard</button>
      <button class="filter-btn" data-filter="eclass" data-value="boss">Boss</button>
      <button class="filter-btn" data-filter="eclass" data-value="rare">Rare</button>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <span class="filter-label">Chapter</span>
      <button class="filter-btn active" data-filter="echapter" data-value="all">All</button>
      <button class="filter-btn" data-filter="echapter" data-value="1">1</button>
      <button class="filter-btn" data-filter="echapter" data-value="2">2</button>
      <button class="filter-btn" data-filter="echapter" data-value="3">3</button>
    </div>
  </span>

  </div><!-- /nav-body -->
</div><!-- /sidebar -->

<div id="cards-page">
<h1>Voidrunner — Card Viewer</h1>
<div class="meta" id="meta-line">Loading...</div>

<div id="protocols-weapon-section">
  <div class="section-title">Protocols — Weapon</div>
  <div class="grid" id="protocols-weapon"></div>
</div>

<div id="protocols-shield-section">
  <div class="section-title">Protocols — Shield</div>
  <div class="grid" id="protocols-shield"></div>
</div>

<div id="protocols-system-section">
  <div class="section-title">Protocols — System</div>
  <div class="grid" id="protocols-system"></div>
</div>

<div id="routines-section">
  <div class="section-title">Routines</div>
  <div class="grid" id="routines"></div>
</div>

<div id="wip-section">
  <div class="section-title">In Progress</div>
  <div class="grid" id="wip"></div>
</div>
</div><!-- /cards-page -->

<div id="enemies-page" hidden>
  <h1>Voidrunner — Enemies</h1>
  <div class="meta" id="emeta-line">Loading…</div>

  <div id="enemies-standard-section">
    <div class="section-title">Standard Enemies</div>
    <div class="grid" id="enemies-standard"></div>
  </div>

  <div id="enemies-boss-section">
    <div class="section-title">Bosses</div>
    <div class="grid" id="enemies-boss"></div>
  </div>

  <div id="enemies-rare-section">
    <div class="section-title">Rare Encounters</div>
    <div class="grid" id="enemies-rare"></div>
  </div>
</div><!-- /enemies-page -->

<script>
// ─── SINGLE SOURCE OF TRUTH ──────────────────────────────────────────────────

const RPS = {
  arc:     { plasma: 1.25, gamma: 1.00, arc:    0.75 },
  plasma:  { gamma:  1.25, arc:   1.00, plasma: 0.75 },
  gamma:   { arc:    1.25, plasma: 1.00, gamma:  0.75 },
  kinetic: { plasma: 1.00, gamma:  1.00, arc:    1.00 }
};

const CANNON_UPGRADES = [[1,26],[2,28],[3,30],[4,32],[5,35]];

const KINETIC_CORE = {
  shieldUpDmg:   15,
  shieldDownDmg: 30,
  upgradePenetration: '50% → 65% (shield up: 20 dmg)'
};

const MORPHIC_VEIL = {
  deployHP: 150,
  reactivatePct: 10,
  heatPrep: 1,
  heatReactivate: 1,
  upgrade: 'Deploy +200 HP · Reactivate +40 HP (20%) · 0 heat'
};

const SHIELD_COMMON = {
  hpAdd:  [0, 5, 10, 15, 25],   // cumulative HP added per tier (T1=+0)
  react:  [10, 11, 12, 13, 15]  // reactivation % per tier
};

const PLAYER_HULL = 140;

// ─── HELPERS ─────────────────────────────────────────────────────────────────

const floor = Math.floor;

function rps(base, weaponType, shieldType) {
  return floor(base * RPS[weaponType][shieldType]);
}

function rpsRow(base, weaponType) {
  const shields = Object.keys(RPS[weaponType]);
  return shields.map(s => `vs ${cap(s)}: <strong>${rps(base, weaponType, s)}</strong>`).join(' &nbsp;·&nbsp; ');
}

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function upgradeTrack(upgrades) {
  return upgrades.map(([pip, dmg]) => `<span>${pip}/5</span> ${dmg}`).join(' &nbsp;');
}

function tags(...list) {
  return list.map(t => `<span class="tag ${t.cls}">${t.label}</span>`).join('');
}

function card(rarity, extra, content, opts = {}) {
  const sec  = opts.section || 'protocol';
  const type = opts.type    || '';
  const elem = opts.element || '';
  return `<div class="card ${rarity}${extra}" data-section="${sec}" data-type="${type}" data-element="${elem}" data-rarity="${rarity}">${content}</div>`;
}

function wip(rarity, content, opts = {}) {
  return card(rarity, ' wip', content, { section: 'wip', ...opts });
}

// ─── ENEMY CARDS ─────────────────────────────────────────────────────────────

function ecChip(s) { return `<span class="echip ${s.atk ? 'atk' : ''}">${s.label}</span>`; }

function rpsLine(t) {
  const rel = { arc:['arc','gamma','plasma'], plasma:['plasma','arc','gamma'], gamma:['gamma','plasma','arc'] }[t];
  if (!rel) return '';
  const cl = { arc:'e-arc', plasma:'e-plasma', gamma:'e-gamma' };
  const [res, weak, neu] = rel;
  return `resists <span class="${cl[res]}">${res}</span> &nbsp;·&nbsp; weak to <span class="${cl[weak]}">${weak}</span> &nbsp;·&nbsp; neutral <span class="${cl[neu]}">${neu}</span>`;
}

function loadRow(label, slot) {
  const flag = slot.ok ? '<span class="e-ok">✓</span>' : `<span class="e-warn">⚠ ${slot.note || 'needs design'}</span>`;
  const routines = slot.routines ? `<span class="e-dim"> + ${slot.routines}</span>` : '';
  return `<div class="erow"><span class="elbl">${label}</span><span class="e-val" style="text-align:right">${slot.protocol}${routines} ${flag}</span></div>`;
}

function enemyCard(e) {
  const chap = String(e.chapter || '').replace(/[–-]/g, ' ');
  const sColor = { arc:'#1d9ec4', plasma:'#ff7a3c', gamma:'#a855f7' }[e.shieldType] || '#4a4d58';
  const sCl    = { arc:'e-arc', plasma:'e-plasma', gamma:'e-gamma' }[e.shieldType] || '';
  const tag    = e.cls === 'boss' ? '◆ BOSS' : e.cls === 'rare' ? '◆ RARE' : '◆ HOSTILE';

  const head = `<div class="ecard-sec ecard-head"><div style="flex:1;min-width:0;">
      <div class="ecard-tag">${tag}</div>
      <div class="ecard-name">${e.name}</div>
      <div class="ecard-meta">${[e.type, e.fight ? 'FIGHT ' + e.fight : 'CH.' + e.chapter, e.tier ? 'TIER: ' + e.tier : ''].filter(Boolean).join(' · ')}</div>
    </div></div>`;

  const stype = e.shieldType ? `<div class="ecard-sec">
      <div class="erow" style="margin-bottom:5px;"><span class="elbl">Shield type</span>
        <span class="e-val ${sCl}" style="text-transform:uppercase;border:1px solid #2a2d35;border-radius:3px;padding:2px 7px;">${e.shieldType}</span></div>
      <div style="font-size:11px;color:#6b6f78;">${rpsLine(e.shieldType)}</div></div>` : '';

  const bar = (lbl, val, color) => `<div><div class="erow" style="margin-bottom:4px;"><span class="elbl">${lbl}</span><span class="e-val">${val} / ${val}</span></div><div class="ebar"><div style="width:100%;background:${color};"></div></div></div>`;
  const hp = (e.shield != null || e.hull != null) ? `<div class="ecard-sec" style="display:flex;flex-direction:column;gap:8px;">
      ${e.shield != null ? bar('Shield', e.shield, sColor) : ''}
      ${e.hull   != null ? bar('Hull',   e.hull,  '#ff2840') : ''}
      <div style="font-size:11px;color:#4f535c;text-align:right;">${(e.shield || 0) + (e.hull || 0)} total · placeholder</div></div>` : '';

  const intent = e.intent ? `<div class="ecard-sec">
      <div class="elbl" style="margin-bottom:7px;">Intent${e.intentTitle ? ' — ' + e.intentTitle : ''}</div>
      <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">${e.intent.map(ecChip).join('<span class="e-dim">→</span>')}</div>
      ${e.intentNote ? `<div style="font-size:11px;color:#6b6f78;margin-top:7px;">${e.intentNote}</div>` : ''}</div>` : '';

  const phases = e.phases ? `<div class="ecard-sec"><div class="elbl" style="margin-bottom:6px;">Phases</div>
      <div style="font-size:12px;color:#9aa0ab;line-height:1.6;">${e.phases}</div></div>` : '';

  const load = (e.weapon || e.shield_p) ? `<div class="ecard-sec" style="display:flex;flex-direction:column;gap:8px;">
      <div class="elbl">Loadout</div>
      ${e.weapon ? loadRow('Weapon', e.weapon) : ''}
      ${e.shield_p ? loadRow('Shield', e.shield_p) : ''}</div>` : '';

  const drops = e.drops ? `<div class="ecard-sec" style="background:#0a0b0e;">
      <div class="elbl" style="margin-bottom:6px;">Drops on scan</div>

function divider() { return `<hr class="divider">`; }

function row(label, value) {
  return `<div class="card-row"><span>${label}</span><span>${value}</span></div>`;
}

// Unified meta block — all cards show all four fields; missing values show —
// Renders only the fields a card actually passes — no blank/placeholder rows.
// Weapon protocols pass weaponType/heat/drop; shields pass heat/drop; routines pass compat/heat.
function metaRows({ weaponType, compat, heat, drop, conditions } = {}) {
  let html = '';
  if (weaponType) html += row('Weapon type',     weaponType);
  if (compat)     html += row('Compatible with', compat);
  if (heat)       html += row('Heat cost',       heat);
  if (drop)       html += row('Drop',            drop);
  if (conditions) {
    const list = Array.isArray(conditions) ? conditions : [conditions];
    list.forEach(c => { html += `<div class="card-conditions">⚠ ${c}</div>`; });
  }
  return html;
}

function perk5(label, content) {
  return `<div class="card-5perk"><div class="perk5-label">5/5 — ${label}</div><div class="card-effect" style="margin-top:4px">${content}</div></div>`;
}

// ─── FILTER ───────────────────────────────────────────────────────────────────

const activeFilters = { view: 'cards', section: 'all', type: 'all', element: 'all', rarity: 'all', eclass: 'all', echapter: 'all', search: '' };

function applyFilters() {
  const q = activeFilters.search.toLowerCase();

  // view switch
  document.body.classList.toggle('view-enemies', activeFilters.view === 'enemies');
  document.getElementById('cards-page').hidden   = activeFilters.view !== 'cards';
  document.getElementById('enemies-page').hidden = activeFilters.view !== 'enemies';

  // cards
  const sf = activeFilters.section, tf = activeFilters.type, ef = activeFilters.element, rf = activeFilters.rarity;
  document.querySelectorAll('.card').forEach(c => {
    const secMatch    = sf === 'all' || c.dataset.section === sf;
    const typeMatch   = tf === 'all' || c.dataset.type === tf;
    const elemMatch   = ef === 'all' || (c.dataset.element || '').split(' ').includes(ef);
    const rarityMatch = rf === 'all' || c.dataset.rarity === rf;
    const name        = (c.querySelector('.card-name')?.textContent || '').toLowerCase();
    const effect      = (c.querySelector('.card-effect')?.textContent || '').toLowerCase();
    const searchMatch = q === '' || name.includes(q) || effect.includes(q);
    c.hidden = !(secMatch && typeMatch && elemMatch && rarityMatch && searchMatch);
  });
  ['protocols-weapon-section','protocols-shield-section','protocols-system-section','routines-section','wip-section'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.hidden = [...el.querySelectorAll('.card')].every(c => c.hidden);
  });

  // filtered count on the cards meta line
  const metaEl = document.getElementById('meta-line');
  if (metaEl && metaEl.dataset.base) {
    const allCards = document.querySelectorAll('.card');
    const visible  = [...allCards].filter(c => !c.hidden).length;
    metaEl.innerHTML = metaEl.dataset.base + (visible !== allCards.length
      ? ` &nbsp;·&nbsp; <span style="color:#8a8ad0;">Filtered results — ${visible} cards</span>` : '');
  }

  // enemies
  const cf = activeFilters.eclass, chf = activeFilters.echapter;
  document.querySelectorAll('.ecard').forEach(c => {
    const clsMatch = cf === 'all' || c.dataset.eclass === cf;
    const chMatch  = chf === 'all' || (c.dataset.echapter || '').split(' ').includes(chf);
    const name     = (c.querySelector('.ecard-name')?.textContent || '').toLowerCase();
    const searchMatch = q === '' || name.includes(q);
    c.hidden = !(clsMatch && chMatch && searchMatch);
  });
  ['enemies-standard-section','enemies-boss-section','enemies-rare-section'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.hidden = [...el.querySelectorAll('.ecard')].every(c => c.hidden);
  });
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn || !btn.dataset.filter) return;   // skip non-group buttons (e.g. Clear filters)
  const ft  = btn.dataset.filter;
  const val = btn.dataset.value;
  document.querySelectorAll(`.filter-btn[data-filter="${ft}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilters[ft] = val;
  applyFilters();
});

document.getElementById('search-box').addEventListener('input', e => {
  activeFilters.search = e.target.value;
  applyFilters();
});

document.getElementById('clear-filters').addEventListener('click', () => {
  activeFilters.section = activeFilters.type = activeFilters.element = activeFilters.rarity = 'all';
  activeFilters.eclass = activeFilters.echapter = 'all';
  activeFilters.search = '';
  document.getElementById('search-box').value = '';
  // reset every group's active state to its "All" button (leave the View toggle as-is)
  document.querySelectorAll('.filter-btn[data-filter]:not([data-filter="view"])').forEach(b =>
    b.classList.toggle('active', b.dataset.value === 'all')
  );
  applyFilters();
});

// ─── SIDEBAR COLLAPSE ─────────────────────────────────────────────────────────

document.getElementById('nav-toggle').addEventListener('click', () => {
  const collapsed = document.body.classList.toggle('nav-collapsed');
  document.getElementById('nav-toggle').textContent = collapsed ? '›' : '‹';
});

// ─── RENDER ───────────────────────────────────────────────────────────────────

function render() {
  let complete = 0, inProgress = 0;

  for (const [sectionId, cardList] of Object.entries(CARDS)) {
    const container = document.getElementById(sectionId);
    if (!container) continue;
    container.innerHTML = cardList.join('');
    if (sectionId === 'wip') inProgress += cardList.length;
    else complete += cardList.length;
  }

  const metaEl = document.getElementById('meta-line');
  metaEl.dataset.base = `Last updated: 2026-06-13 &nbsp;·&nbsp; ${complete} cards`;
  metaEl.innerHTML = metaEl.dataset.base;

  let enemyCount = 0;
  for (const [sectionId, list] of Object.entries(ENEMIES)) {
    const container = document.getElementById(sectionId);
    if (!container) continue;
    container.innerHTML = list.join('');
    enemyCount += list.length;
  }
  document.getElementById('emeta-line').innerHTML =
    `${enemyCount} entries &nbsp;·&nbsp; loadouts under revision — amber flags mark what's not yet designed`;

  applyFilters();
}

render();
</script>
